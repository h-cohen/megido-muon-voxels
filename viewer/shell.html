<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Megiddo voxel viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
               font: 13px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="app-root">
  <div id="resolution-banner" style="position:absolute;top:0;left:0;right:0;z-index:3;padding:6px 12px;font-weight:bold;text-align:center;pointer-events:none"></div>
  <input id="load-run-input" type="file" webkitdirectory multiple
         style="position:absolute;top:8px;left:8px;z-index:2" />
  <input id="load-second-run-input" type="file" webkitdirectory multiple
         style="position:absolute;top:36px;left:8px;z-index:2" />
  <div id="delta-verdict" style="position:absolute;top:36px;left:220px;z-index:2;color:#eee"></div>
  <button id="export-png-btn" style="position:absolute;bottom:8px;right:8px;z-index:4">Export PNG</button>
  <div id="camera-presets" style="position:absolute;top:8px;right:8px;z-index:2">
    <button id="camera-preset-top">Top</button>
    <button id="camera-preset-front">Front</button>
    <button id="camera-preset-side">Side</button>
    <button id="camera-preset-iso">Iso</button>
  </div>
  <div id="layer-panel" style="position:absolute;top:48px;right:8px;z-index:2;background:#000a;padding:6px;color:#eee"></div>
  <div id="clip-panel" style="position:absolute;top:48px;left:8px;z-index:2;background:#000a;padding:6px;color:#eee;max-width:230px;width:230px;box-sizing:border-box">
    <div>Clip box</div>
    <label style="display:block">x min <input id="clip-x-min" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label style="display:block">x max <input id="clip-x-max" type="range" min="0" max="1" step="0.01" value="1" /></label>
    <label style="display:block">y min <input id="clip-y-min" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label style="display:block">y max <input id="clip-y-max" type="range" min="0" max="1" step="0.01" value="1" /></label>
    <label style="display:block">z min <input id="clip-z-min" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label style="display:block">z max <input id="clip-z-max" type="range" min="0" max="1" step="0.01" value="1" /></label>
    <div>Slice</div>
    <select id="slice-axis">
      <option value="none">none</option>
      <option value="x">x</option>
      <option value="y">y</option>
      <option value="z">z</option>
    </select>
    <input id="slice-pos" type="range" min="0" max="1" step="0.01" value="0.5" style="display:block;width:100%" />
    <div>Clip plane</div>
    <label style="display:block"><input id="clip-plane-enabled" type="checkbox" /> enabled</label>
    <label style="display:block">d <input id="clip-plane-d" type="range" min="-0.87" max="0.87" step="0.01" value="0" /></label>
    <div>Uncertainty gate</div>
    <label style="display:block"><input id="sigma-gate-enabled" type="checkbox" /> hide sigma above</label>
    <input id="sigma-gate-value" type="range" min="0" max="1" step="0.01" value="1" style="display:block;width:100%" />
  </div>
  <div id="hover-readout" style="position:absolute;bottom:180px;left:8px;z-index:2;background:#000a;color:#eee;padding:4px 8px;font-family:monospace"></div>
  <canvas id="gl-canvas" style="display:block;width:100vw;height:100vh"></canvas>
  <div id="transfer-panel" style="position:absolute;bottom:8px;left:8px;right:8px;z-index:2;background:#000a;padding:6px">
    <canvas id="xfer-canvas" width="512" height="40" style="width:100%;height:28px;display:block"></canvas>
    <canvas id="histogram-canvas" width="512" height="60" style="width:100%;height:72px;display:block"></canvas>
    <label>Window lo <input id="window-lo" type="range" min="0" max="1" step="0.001" value="0" /></label>
    <label>Window hi <input id="window-hi" type="range" min="0" max="1" step="0.001" value="1" /></label>
  </div>
</div>
<script>
/* __VIEWER_BUNDLE__ */
</script>
</body>
</html>
